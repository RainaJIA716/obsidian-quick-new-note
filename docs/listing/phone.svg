<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1600" width="900" height="1600">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #2f2a24; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .title { font-size: 34px; font-weight: 700; }
    .sub { font-size: 18px; fill: #8b8177; }
    .crumb { font-size: 16px; fill: #8b8177; }
    .crumb-b { font-size: 16px; fill: #2f2a24; }
    .h1 { font-size: 28px; font-weight: 700; }
    .line { fill: #e9e3d8; }
    .item { font-size: 16px; }
    .item-hi { font-size: 16px; fill: #7a5af8; font-weight: 600; }
    .note { font-size: 15px; fill: #5c5249; }
    .small { font-size: 13px; fill: #8b8177; }
    .note-b { font-size: 15px; font-weight: 600; fill: #7a5af8; }
    .fm { font-size: 14px; fill: #5c5249; }
    .icon { fill: none; stroke: #8b8177; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .icon-hi { fill: none; stroke: #7a5af8; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .callout { fill: none; stroke: #7a5af8; stroke-width: 1.6; stroke-dasharray: 5 4; }
    .arrow { fill: none; stroke: #7a5af8; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <!-- lucide file-plus -->
    <g id="file-plus">
      <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/>
      <path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M9 15h6"/><path d="M12 18v-6"/>
    </g>
    <!-- lucide glasses -->
    <g id="glasses">
      <circle cx="6" cy="15" r="4"/><circle cx="18" cy="15" r="4"/>
      <path d="M14 15a2 2 0 0 0-2-1 2 2 0 0 0-2 1"/><path d="M2.5 13 5 7c.7-1.3 1.4-2 3-2"/><path d="M21.5 13 19 7c-.7-1.3-1.5-2-3-2"/>
    </g>
    <g id="more"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></g>
    <!-- lucide folder -->
    <g id="folder"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></g>
    <!-- lucide folder-open -->
    <g id="folder-open"><path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/></g>
    <!-- lucide folder-search -->
    <g id="folder-search">
      <path d="M10.7 20H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H20a2 2 0 0 1 2 2v4.1"/>
      <circle cx="17" cy="17" r="3"/><path d="m21 21-1.9-1.9"/>
    </g>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#5c4a32" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="900" height="1600" fill="#FAF8F4"/>
<text x="450" y="110" text-anchor="middle" class="title" style="font-size:52px">Quick New Note</text>
<text x="450" y="170" text-anchor="middle" class="sub" style="font-size:28px">Tap the button, pick the folder.</text>
<text x="450" y="1580" text-anchor="middle" class="sub" style="font-size:26px">The note gets that folder's Templater template.</text>
<!-- ===== Phone ===== -->
  <g transform="translate(131,250) scale(2.2)">
    <rect width="290" height="580" rx="36" fill="#2f2a24"/>
    <rect x="10" y="10" width="270" height="560" rx="28" fill="#fdfcfa"/>
    <rect x="110" y="20" width="70" height="18" rx="9" fill="#2f2a24"/>
    <!-- phone header -->
    <rect x="160" y="54" width="108" height="38" rx="19" fill="#f4efe6"/>
    <use href="#file-plus" class="icon-hi" transform="translate(172,61)"/>
    <use href="#glasses" class="icon" transform="translate(204,61)"/>
    <use href="#more" class="icon" transform="translate(236,61)"/>
    <text x="30" y="132" style="font-size:20px;font-weight:700">Reading notes</text>
    <rect x="30" y="150" width="200" height="10" rx="5" class="line"/>
    <rect x="30" y="170" width="170" height="10" rx="5" class="line"/>
    <rect x="30" y="190" width="190" height="10" rx="5" class="line"/>
    <!-- dim + bottom sheet -->
    <rect x="10" y="10" width="270" height="560" rx="28" fill="#2f2a24" opacity="0.18"/>
    <path d="M10 286h270v256a28 28 0 0 1-28 28H38a28 28 0 0 1-28-28Z" fill="#f4efe6"/>
    <rect x="125" y="298" width="40" height="5" rx="2.5" fill="#c9c1b6"/>
    <rect x="24" y="314" width="242" height="44" rx="14" fill="#ffffff"/>
    <use href="#folder-open" class="icon" transform="translate(36,327) scale(0.75)"/>
    <text x="64" y="342" class="item">Current folder</text>
    <rect x="24" y="368" width="242" height="134" rx="14" fill="#ffffff"/>
    <use href="#folder" class="icon" transform="translate(36,379) scale(0.75)"/>
    <text x="64" y="394" class="item">Projects</text>
    <line x1="36" y1="412" x2="254" y2="412" stroke="#ece6dc"/>
    <use href="#folder" class="icon-hi" transform="translate(36,423) scale(0.75)"/>
    <text x="64" y="438" class="item-hi">Meetings</text>
    <line x1="36" y1="456" x2="254" y2="456" stroke="#ece6dc"/>
    <use href="#folder" class="icon" transform="translate(36,467) scale(0.75)"/>
    <text x="64" y="482" class="item">Reading</text>
    <rect x="24" y="512" width="242" height="44" rx="14" fill="#ffffff"/>
    <use href="#folder-search" class="icon" transform="translate(36,525) scale(0.75)"/>
    <text x="64" y="540" class="item">Other folder…</text>
    
  </g>
</svg>
